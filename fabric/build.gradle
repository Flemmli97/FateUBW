apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/arch-loom-v2/fabric.gradle"

ext {
    mod_meta.tenshilib_version = tenshilib_version
    mod_meta.forge_config_api = forge_config_api
    mod_meta.sbl_version = sbl_version
}

dependencies {
    modImplementation "io.github.flemmli97:tenshilib:${tenshilib_version}-fabric"
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api}"
    modImplementation "net.tslat.smartbrainlib:SmartBrainLib-fabric-${minecraft_version}:${sbl_version}"

    modRuntimeOnly "net.favouriteless.modopedia:modopedia-fabric-${minecraft_version}:${modopedia}"
}